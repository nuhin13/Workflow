<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>SCR-010 Private money</title><link rel="stylesheet" href="styles.css"></head><body><main class="prototype-page"><h1 class="prototype-title"><span>SCR-010</span> Private money</h1><section class="device" data-screen-label="S8 Money"><header class="topbar"><span class="brand">G</span><span class="topbar-copy"><strong>মালিকের টাকা</strong><small>ব্যক্তিগত</small></span><button class="badge primary" onclick="lock()">লক</button></header><section id="pin" class="content stack center" data-screen-label="S8 PIN gate"><div class="metric">🔒</div><h2>মালিকের PIN দিন</h2><div class="pin-dots"><i class="pin-dot filled"></i><i class="pin-dot filled"></i><i class="pin-dot"></i><i class="pin-dot"></i></div><div class="keypad"><button class="key">১</button><button class="key">২</button><button class="key">৩</button><button class="key">৪</button><button class="key">৫</button><button class="key">৬</button><button class="key">৭</button><button class="key">৮</button><button class="key">৯</button><button class="key"> </button><button class="key" onclick="unlock()">০</button><button class="key">⌫</button></div><button class="button block" onclick="unlock()">ডেমো PIN ১২৩৪</button></section><section id="money" class="content stack" hidden><div class="row"><h2 class="grow">আজ</h2><button class="button secondary" onclick="toggle('expense')">+ খরচ</button></div><div class="card"><button class="summary-row button ghost block" onclick="toggle('entries')"><span>ক্যাশ আয়</span><b class="success">৳৮,৫০০</b></button><div class="summary-row"><span>বিকাশ আয়</span><b class="success">৳৪,০০০</b></div><div class="summary-row"><span>খরচ</span><b class="danger">৳২,১০০</b></div><div class="summary-row"><span>বাকি আদায়</span><b>৳১,২০০</b></div><div class="summary-row net"><b>নিট</b><b>৳১০,৪০০</b></div></div><div class="card"><h3>এই মাস</h3><div class="summary-row"><span>আয়</span><b class="success">৳১,৪২,০০০</b></div><div class="summary-row"><span>খরচ</span><b class="danger">৳৪১,০০০</b></div></div></section><nav class="bottom-nav"><a href="SCR-002-dashboard.html">⌂<span>হোম</span></a><a href="SCR-003-jobs-board.html">▤<span>কাজ</span></a><a class="plus" href="SCR-004-new-job.html">+</a><a href="SCR-009-dues-reminders.html">◎<span>বাকি</span></a><a class="active" href="SCR-010-private-money.html">৳<span>টাকা</span></a></nav><div id="scrim" class="scrim" hidden onclick="closeSheets()"></div><aside id="entries" class="sheet" hidden data-screen-label="S8 Entries drill-down"><div class="sheet-handle"></div><h2>ক্যাশ আয়</h2><div class="list-row"><span class="grow">রহিমের পেমেন্ট</span><b>৳৮০০</b></div><div class="list-row"><span class="grow">করিমের পেমেন্ট</span><b>৳১,২০০</b></div></aside><aside id="expense" class="sheet" hidden data-screen-label="S8 Quick expense"><div class="sheet-handle"></div><h2>খরচ যোগ করুন</h2><div class="metric center">৳০</div><div class="chips"><button class="chip selected">পার্টস</button><button class="chip">চা</button><button class="chip">বিদ্যুৎ</button></div><div class="keypad"><button class="key">১</button><button class="key">২</button><button class="key">৩</button><button class="key">৪</button><button class="key">৫</button><button class="key">৬</button><button class="key">৭</button><button class="key">৮</button><button class="key">৯</button><button class="key">C</button><button class="key">০</button><button class="key">⌫</button></div><button class="button secondary block" onclick="closeSheets()">সংরক্ষণ করুন</button></aside></section></main><script>function unlock(){pin.hidden=true;money.hidden=false}function lock(){money.hidden=true;pin.hidden=false;closeSheets()}function toggle(id){closeSheets();document.getElementById(id).hidden=false;scrim.hidden=false}function closeSheets(){document.querySelectorAll('.sheet').forEach(x=>x.hidden=true);scrim.hidden=true}</script></body></html>
