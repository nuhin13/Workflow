<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Money summary states</title><link rel="stylesheet" href="../prototype/styles.css"></head><body class="demo"><h1>Money summary</h1><main class="demo-grid">
<section class="demo-state"><h2>Locked</h2><div class="card center">🔒<p>মালিকের PIN দিয়ে টাকা দেখুন</p></div></section>
<section class="demo-state"><h2>Owner PIN unlocked</h2><div class="card"><div class="summary-row"><span>আয়</span><b class="success">৳১২,৫০০</b></div><div class="summary-row"><span>খরচ</span><b class="danger">৳২,১০০</b></div><div class="summary-row net"><span>নিট</span><b>৳১০,৪০০</b></div></div></section>
<section class="demo-state"><h2>Loading</h2><div class="loading-box" aria-busy="true">হিসাব আসছে…</div></section>
<section class="demo-state"><h2>Error</h2><div class="error-box">হিসাব আনা যায়নি। কোনো অঙ্ক দেখানো হয়নি।</div></section>
<section class="demo-state"><h2>Empty</h2><div class="empty">আজ কোনো টাকা লেনদেন নেই।</div></section>
</main></body></html>
