<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Bill card states</title><link rel="stylesheet" href="../prototype/styles.css"></head><body class="demo"><h1>Bill card</h1><main class="demo-grid">
