<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Numeric keypad states</title><link rel="stylesheet" href="../prototype/styles.css"></head><body class="demo"><h1>Numeric keypad</h1><main class="demo-grid">
<section class="demo-state"><h2>Default, hover, focus</h2><div class="keypad"><button class="key">১</button><button class="key" autofocus>২</button><button class="key">৩</button><button class="key">৪</button><button class="key">৫</button><button class="key">৬</button><button class="key">৭</button><button class="key">৮</button><button class="key">৯</button><button class="key">C</button><button class="key">০</button><button class="key">⌫</button></div></section>
<section class="demo-state disabled"><h2>Disabled</h2><div class="keypad"><button class="key" disabled>১</button><button class="key" disabled>২</button><button class="key" disabled>৩</button></div></section>
<section class="demo-state"><h2>Loading</h2><div class="loading-box"><span class="spinner">◌</span></div></section>
<section class="demo-state"><h2>Error</h2><div class="error-box">চার সংখ্যার PIN মিলেনি।</div></section>
<section class="demo-state"><h2>Empty</h2><div class="pin-dots"><i class="pin-dot"></i><i class="pin-dot"></i><i class="pin-dot"></i><i class="pin-dot"></i></div></section>
</main></body></html>
