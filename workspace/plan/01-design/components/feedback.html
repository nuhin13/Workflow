<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Feedback states</title><link rel="stylesheet" href="../prototype/styles.css"></head><body class="demo"><h1>Feedback</h1><main class="demo-grid">
<section class="demo-state"><h2>Loading</h2><div class="loading-box" aria-live="polite"><span class="spinner">◌</span> তথ্য আসছে</div></section>
<section class="demo-state"><h2>Success</h2><div class="success-box" role="status">খরচ সংরক্ষণ হয়েছে।</div></section>
<section class="demo-state"><h2>Error</h2><div class="error-box" role="alert">সংযোগ হয়নি। আবার চেষ্টা করুন।</div></section>
<section class="demo-state"><h2>Empty</h2><div class="empty">এখনও কোনো রেকর্ড নেই।</div></section>
<section class="demo-state"><h2>Offline</h2><div class="warning">অফলাইন — Pro সিঙ্ক পরে হবে।</div></section>
<section class="demo-state"><h2>Toast</h2><div class="card dark" role="status">SMS পাঠানো হয়েছে।</div></section>
</main></body></html>
