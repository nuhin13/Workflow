<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Bottom sheet states</title><link rel="stylesheet" href="../prototype/styles.css"></head><body class="demo"><h1>Bottom sheet</h1><main class="demo-grid">
<section class="demo-state"><h2>Default and focus</h2><div class="card"><div class="sheet-handle"></div><h3>দ্রুত কাজ</h3><button class="button block" autofocus>নতুন কাজ</button></div></section>
<section class="demo-state disabled"><h2>Disabled</h2><div class="card">এই শিট এখন খোলা যাবে না।</div></section>
<section class="demo-state"><h2>Loading</h2><div class="loading-box" aria-busy="true"><span class="spinner">◌</span> আসছে</div></section>
<section class="demo-state"><h2>Error</h2><div class="error-box">তথ্য আনা যায়নি।</div></section>
<section class="demo-state"><h2>Empty</h2><div class="empty">দেখানোর মতো কিছু নেই।</div></section>
</main></body></html>
