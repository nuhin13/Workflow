<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Button states</title><link rel="stylesheet" href="../prototype/styles.css"></head><body class="demo"><h1>Button</h1><main class="demo-grid">
<section class="demo-state"><h2>Default</h2><button class="button">কাজটি সংরক্ষণ করুন</button></section>
<section class="demo-state"><h2>Hover</h2><button class="button">হোভার করুন</button></section>
<section class="demo-state"><h2>Focus</h2><button class="button" autofocus>ফোকাস</button></section>
<section class="demo-state"><h2>Disabled</h2><button class="button" disabled>পাওয়া যাবে না</button></section>
<section class="demo-state"><h2>Loading</h2><button class="button" aria-busy="true"><span class="spinner">◌</span>&nbsp; সংরক্ষণ হচ্ছে</button></section>
<section class="demo-state"><h2>Error</h2><button class="button danger" aria-describedby="button-error">আবার চেষ্টা করুন</button><p id="button-error" class="field-error">কাজটি সংরক্ষণ হয়নি।</p></section>
<section class="demo-state"><h2>Empty</h2><button class="button" disabled>নির্বাচন করুন</button></section>
</main></body></html>
