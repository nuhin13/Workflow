<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Admin shell states</title><link rel="stylesheet" href="../prototype/styles.css"></head><body class="demo"><h1>Admin shell</h1><main class="demo-grid">
<section class="demo-state"><h2>Default and focus</h2><div class="card dark"><div class="row"><span class="brand">G</span><span class="grow"><strong>Garazo Admin</strong><small class="faint">Authorized support</small></span><span class="badge success">Product scope</span></div></div></section>
<section class="demo-state"><h2>Disabled</h2><div class="card disabled">Control unavailable for this scope.</div></section>
<section class="demo-state"><h2>Loading</h2><div class="loading-box" aria-busy="true">Loading authorized scope…</div></section>
<section class="demo-state"><h2>Error</h2><div class="error-box">Authorization failed. No controls are shown.</div></section>
<section class="demo-state"><h2>Empty</h2><div class="empty">No records match this authorized scope.</div></section>
</main></body></html>
