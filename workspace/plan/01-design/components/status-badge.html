<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Status badge states</title><link rel="stylesheet" href="../prototype/styles.css"></head><body class="demo"><h1>Status badge</h1><main class="demo-grid">
<section class="demo-state"><h2>Default</h2><span class="badge neutral">খোলা</span></section>
<section class="demo-state"><h2>Working</h2><span class="badge primary">কাজ চলছে</span></section>
<section class="demo-state"><h2>Ready</h2><span class="badge success">ডেলিভারির জন্য প্রস্তুত</span></section>
<section class="demo-state"><h2>Overdue</h2><span class="badge danger">সময় পেরিয়েছে</span></section>
<section class="demo-state disabled"><h2>Disabled</h2><span class="badge neutral">বন্ধ</span></section>
<section class="demo-state"><h2>Loading</h2><span class="badge neutral"><span class="spinner">◌</span> আসছে</span></section>
<section class="demo-state"><h2>Error</h2><span class="badge danger">অজানা অবস্থা</span></section>
<section class="demo-state"><h2>Empty</h2><span class="badge neutral">অবস্থা নেই</span></section>
</main></body></html>
