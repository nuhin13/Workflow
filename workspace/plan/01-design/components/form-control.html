<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Form control states</title><link rel="stylesheet" href="../prototype/styles.css"></head><body class="demo"><h1>Form control</h1><main class="demo-grid">
<section class="demo-state"><h2>Default</h2><label>গাড়ির নম্বর<input class="input" value="ঢাকা মেট্রো-ল-১২-৩৪৫৬"></label></section>
<section class="demo-state"><h2>Hover</h2><label>মোবাইল<input class="input" value="01712-000000"></label></section>
<section class="demo-state"><h2>Focus</h2><label>খুঁজুন<input class="input" autofocus placeholder="নাম, ফোন বা নম্বর"></label></section>
<section class="demo-state"><h2>Disabled</h2><input class="input" disabled value="পরিবর্তন করা যাবে না"></section>
<section class="demo-state"><h2>Loading</h2><input class="input" aria-busy="true" value="তথ্য আসছে…" disabled></section>
<section class="demo-state"><h2>Error</h2><input class="input error" aria-invalid="true"><p class="field-error">গাড়ির নম্বর দিন।</p></section>
<section class="demo-state"><h2>Empty</h2><input class="input" placeholder="এখনও কিছু লেখা হয়নি"></section>
</main></body></html>
