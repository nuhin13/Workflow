<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Selection chip states</title><link rel="stylesheet" href="../prototype/styles.css"></head><body class="demo"><h1>Selection chip</h1><main class="demo-grid">
<section class="demo-state"><h2>Default, hover, focus</h2><div class="chips"><button class="chip">আজ</button><button class="chip">আগামীকাল</button><button class="chip" autofocus>তারিখ</button></div></section>
<section class="demo-state"><h2>Selected</h2><div class="chips"><button class="chip selected">কাজ চলছে</button><button class="chip primary-selected">ইঞ্জিন</button></div></section>
<section class="demo-state"><h2>Disabled</h2><button class="chip" disabled>লক করা</button></section>
<section class="demo-state"><h2>Loading</h2><button class="chip" aria-busy="true"><span class="spinner">◌</span> আসছে</button></section>
<section class="demo-state"><h2>Error</h2><div class="error-box">কমপক্ষে একটি সমস্যা বাছুন।</div></section>
<section class="demo-state"><h2>Empty</h2><div class="empty">কোনো বিকল্প নেই।</div></section>
</main></body></html>
