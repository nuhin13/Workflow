# Pipeline state — single source of truth. Update after every completed stage.
# A fresh session must be able to resume from this file alone.

project:
  name: Garazo
  one_liner: "A mobile-first management app for Bangladesh's informal vehicle workshops to manage jobs, customers, billing, dues, daily cash, and service reminders."
  started: "2026-07-26"
  profile: medium       # small|medium|large|extra-large|enterprise (set by /kickoff · ADR-0001)

# Artifact versions are first-class (v2 · HADR-0001 D-4). `-vN` files on disk
# (e.g. workspace/docs/business/BRD-v2.md, current pointer = BRD.md). `derived_from`
# lets /trace compute staleness: bump the BRD to v3 and every artifact derived
# from v2 is marked stale automatically instead of a human remembering.
artifacts:
  brd: { version: 1, approved: "2026-07-26" }
  ui:  { version: 1, approved: "2026-07-26", source: html_prototype }
  design: { version: 1, approved: "2026-07-27", derived_from: { ui: 1, prd: 1, feature_list: 1, forecast: 1 } }
  srs: { version: 1, approved: "2026-07-29", derived_from: { brd: 1, prd: 1, design: 1, feature_list: 1 } }
  prd: { version: 1, approved: "2026-07-26", derived_from: { brd: 1, ui: 1 } }
  feature_list: { version: 1, approved: "2026-07-26", derived_from: { prd: 1, brd: 1, ui: 1 } }
  forecast: { version: 1, approved: "2026-07-26", derived_from: { brd: 1, prd: 1, feature_list: 1 } }
  tech_plan: { version: 1, approved: "2026-07-30", derived_from: { srs: 1, design: 1, forecast: 1 } }

phase: dev-plan         # idle | business | design | srs | traceability | tech-plan | dev-plan | build | done

phases:
  business:
    status: done
    artifacts:
      - workspace/docs/business/BRD.md
      - workspace/plan/00-business/idea.md
      - workspace/plan/00-business/prd.md
      - workspace/plan/00-business/feature-list.md
      - workspace/plan/00-business/business-forecast.md
  design:
    status: done
    artifacts:
      - workspace/plan/01-design/tokens.json
      - workspace/plan/01-design/design-system.md
      - workspace/plan/01-design/components/
      - workspace/plan/01-design/screens/
      - workspace/plan/01-design/prototype/
  srs:
    status: done
    artifacts:
      - workspace/spec/srs.md
      - workspace/spec/feature-list.md
      - workspace/spec/glossary.md
  traceability:
    status: done
    artifacts:
      - workspace/plan/02-traceability/matrix.md
      - workspace/plan/02-traceability/discrepancies/D-001.md
  tech-plan:
    status: done
    artifacts:
      - workspace/plan/03-technical/tech-plan.md
      - workspace/plan/03-technical/domain/domain-model.md
      - workspace/plan/03-technical/domain/lifecycle-analysis.md
      - workspace/plan/03-technical/decisions/ADR-0001-application-stack.md
      - workspace/plan/03-technical/decisions/ADR-0002-architecture-style.md
      - workspace/plan/03-technical/decisions/ADR-0003-delivery-methodology.md
      - workspace/plan/03-technical/decisions/ADR-0004-third-party-service-boundary.md
      - workspace/plan/03-technical/decisions/ADR-0005-datastore.md
      - workspace/plan/03-technical/decisions/ADR-0006-hosting-runtime.md
      - workspace/plan/03-technical/decisions/ADR-0007-auth-session.md
      - workspace/plan/03-technical/decisions/ADR-0008-api-style.md
      - workspace/plan/03-technical/decisions/ADR-0009-background-jobs-queue.md
  dev-plan:      { status: pending, artifacts: [] }
  build:         { status: pending }

# Filled by /dev-plan, maintained by /epic, /build, /qa, /checkpoint
epics: []
# - id: E00
#   title: Skeleton
#   status: todo           # todo | specced | in-progress | qa | checkpoint | done | remapped
#   runnable_flow: "…what a human can run when this epic is done…"
#   tasks:
#     - { id: E00-T01, title: "…", status: todo, owner: null }   # todo|in-progress|review-requested|changes-requested|done|verified · side: blocked|frozen
#   qa_report: null
#   checkpoint: null

current_epic: null
blockers: []             # IDs only; details live in workspace/open-questions.md

