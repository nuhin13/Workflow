# Pipeline state — single source of truth. Update after every completed stage.
# A fresh session must be able to resume from this file alone.

project:
  name: Garazo
  one_liner: "A mobile-first management app for Bangladesh's informal vehicle workshops to manage jobs, customers, billing, dues, daily cash, and service reminders."
  started: "2026-07-26"
  profile: medium       # small|medium|large|extra-large|enterprise (set by /kickoff · ADR-0001)

# Artifact versions are first-class (v2 · HADR-0001 D-4). `-vN` files on disk
# (e.g. workspace/docs/business/BRD-v2.md, current pointer = BRD.md). `derived_from`
# lets /trace compute staleness: bump the BRD to v3 and every artifact derived
# from v2 is marked stale automatically instead of a human remembering.
artifacts:
  brd: { version: 1, approved: "2026-07-26" }
  ui:  { version: 1, approved: "2026-07-26", source: html_prototype }
  design: { version: 1, approved: "2026-07-27", derived_from: { ui: 1, prd: 1, feature_list: 1, forecast: 1 } }
  srs: { version: 1, approved: "2026-07-29", derived_from: { brd: 1, prd: 1, design: 1, feature_list: 1 } }
  prd: { version: 1, approved: "2026-07-26", derived_from: { brd: 1, ui: 1 } }
  feature_list: { version: 1, approved: "2026-07-26", derived_from: { prd: 1, brd: 1, ui: 1 } }
  forecast: { version: 1, approved: "2026-07-26", derived_from: { brd: 1, prd: 1, feature_list: 1 } }
  tech_plan: { version: 1, approved: "2026-07-30", derived_from: { srs: 1, design: 1, forecast: 1 } }
  dev_plan: { version: 1, approved: "2026-07-30", derived_from: { srs: 1, design: 1, feature_list: 1, tech_plan: 1 } }

phase: build            # idle | business | design | srs | traceability | tech-plan | dev-plan | build | done

