# Pipeline state — single source of truth. Update after every completed stage.
# A fresh session must be able to resume from this file alone.

project:
  name: Garazo
  one_liner: "A mobile-first management app for Bangladesh's informal vehicle workshops to manage jobs, customers, billing, dues, daily cash, and service reminders."
  started: "2026-07-26"
  profile: medium       # small|medium|large|extra-large|enterprise (set by /kickoff · ADR-0001)

# Artifact versions are first-class (v2 · HADR-0001 D-4). `-vN` files on disk
# (e.g. workspace/docs/business/BRD-v2.md, current pointer = BRD.md). `derived_from`
# lets /trace compute staleness: bump the BRD to v3 and every artifact derived
# from v2 is marked stale automatically instead of a human remembering.
artifacts:
  brd: { version: 1, approved: "2026-07-26" }
  ui:  { version: 1, approved: "2026-07-26", source: html_prototype }
  design: { version: 1, approved: "2026-07-27", derived_from: { ui: 1, prd: 1, feature_list: 1, forecast: 1 } }
  srs: { version: 1, approved: "2026-07-29", derived_from: { brd: 1, prd: 1, design: 1, feature_list: 1 } }
  prd: { version: 1, approved: "2026-07-26", derived_from: { brd: 1, ui: 1 } }
  feature_list: { version: 1, approved: "2026-07-26", derived_from: { prd: 1, brd: 1, ui: 1 } }
  forecast: { version: 1, approved: "2026-07-26", derived_from: { brd: 1, prd: 1, feature_list: 1 } }
  tech_plan: { version: 1, approved: "2026-07-30", derived_from: { srs: 1, design: 1, forecast: 1 } }
  dev_plan: { version: 1, approved: "2026-07-30", derived_from: { srs: 1, design: 1, feature_list: 1, tech_plan: 1 } }

phase: build            # idle | business | design | srs | traceability | tech-plan | dev-plan | build | done

phases:
  business:
    status: done
    artifacts:
      - workspace/docs/business/BRD.md
      - workspace/plan/00-business/idea.md
      - workspace/plan/00-business/prd.md
      - workspace/plan/00-business/feature-list.md
      - workspace/plan/00-business/business-forecast.md
  design:
    status: done
    artifacts:
      - workspace/plan/01-design/tokens.json
      - workspace/plan/01-design/design-system.md
      - workspace/plan/01-design/components/
      - workspace/plan/01-design/screens/
      - workspace/plan/01-design/prototype/
  srs:
    status: done
    artifacts:
      - workspace/spec/srs.md
      - workspace/spec/feature-list.md
      - workspace/spec/glossary.md
  traceability:
    status: done
    artifacts:
      - workspace/plan/02-traceability/matrix.md
      - workspace/plan/02-traceability/discrepancies/D-001.md
  tech-plan:
    status: done
    artifacts:
      - workspace/plan/03-technical/tech-plan.md
      - workspace/plan/03-technical/domain/domain-model.md
      - workspace/plan/03-technical/domain/lifecycle-analysis.md
      - workspace/plan/03-technical/decisions/ADR-0001-application-stack.md
      - workspace/plan/03-technical/decisions/ADR-0002-architecture-style.md
      - workspace/plan/03-technical/decisions/ADR-0003-delivery-methodology.md
      - workspace/plan/03-technical/decisions/ADR-0004-third-party-service-boundary.md
      - workspace/plan/03-technical/decisions/ADR-0005-datastore.md
      - workspace/plan/03-technical/decisions/ADR-0006-hosting-runtime.md
      - workspace/plan/03-technical/decisions/ADR-0007-auth-session.md
      - workspace/plan/03-technical/decisions/ADR-0008-api-style.md
      - workspace/plan/03-technical/decisions/ADR-0009-background-jobs-queue.md
  dev-plan:
    status: done
    artifacts:
      - workspace/plan/04-dev/dev-plan.md
      - workspace/epics/E00-genesis/epic.md
      - workspace/epics/E00-genesis/conventions.md
      - workspace/epics/E00-genesis/tracker.md
      - workspace/epics/E00-genesis/tasks/
  build:         { status: in-progress }

# Filled by /dev-plan, maintained by /epic, /build, /qa, /checkpoint
epics:
  - id: E00
    title: Genesis and Walking Skeleton
    status: in-progress
    runnable_flow: "Start the Compose stack and run the diagnostic Flutter UI through the API to PostgreSQL and back with green CI."
    tasks:
      - { id: E00-T01, title: "Scaffold repository and module boundaries", status: in-progress, owner: developer-backend }
      - { id: E00-T02, title: "Establish OpenAPI and generated clients", status: done, owner: claude-opus-5 }
      - { id: E00-T03, title: "Containerize runtime and CI baseline", status: in-progress, owner: claude-opus-5 }
      - { id: E00-T04, title: "Implement the persistence walking skeleton", status: todo, owner: null }
      - { id: E00-T05, title: "Prove integration and recovery gate", status: todo, owner: null }
    qa_report: null
    checkpoint: null
  - id: E01
    title: Secure Workshop Access
    status: pending
    runnable_flow: "Verify the owner phone, set up the workshop, enter only the authorized workshop, and switch Bangla/English presentation."
  - id: E02
    title: Fast Jobs and Customer Book
    status: pending
    runnable_flow: "Create and progress or batch-enter a job, then find retained customer and vehicle history in a later online session."
  - id: E03
    title: Private Billing and Daily Cash
    status: pending
    runnable_flow: "Unlock protected money, bill and collect or retain a due, share a safe bill, reconcile the day, and relock."
  - id: E04
    title: Plans, Credits, and Service Reminders
    status: pending
    runnable_flow: "Exercise Free/Pro limits, SMS credits, one service reminder, one return, and protected ROI."
  - id: E05
    title: Admin Controls and Pilot Evidence
    status: pending
    runnable_flow: "Use an authorized audited admin control and view only approved pilot evidence."
  - id: E06
    title: Offline Work and Reconciliation
    status: pending
    runnable_flow: "Use approved Pro records offline, reconnect, and reconcile without loss, duplicate money effects, or tenant leaks."
  - id: E07
    title: Mechanics and Salary
    status: pending
    runnable_flow: "Manage approved mechanic and salary records while preserving owner-money privacy."
  - id: E08
    title: Inventory
    status: pending
    runnable_flow: "Record a stock movement and reconcile retained quantity without duplicate effects."
  - id: E09
    title: Appointments and Booking
    status: pending
    runnable_flow: "Submit a valid public booking and open its retained workshop details."
  - id: E10
    title: Reports
    status: pending
    runnable_flow: "Run an approved period report and reconcile its totals or truthful empty state."
  - id: E11
    title: Public Vehicle History
    status: pending
    runnable_flow: "Share a vehicle-history link containing only approved fields and no private workshop money."
  - id: E12
    title: Multi-branch Operation
    status: pending
    runnable_flow: "Select a branch and see only permitted branch records and approved aggregates."
  - id: E13
    title: Fleet Accounts
    status: pending
    runnable_flow: "Distinguish one fleet's vehicles, jobs, bills, and balances from retail and other fleets."
  - id: E14
    title: TireBook Exchange
    status: pending
    runnable_flow: "Exchange a consented booking and approved service history while Garazo remains independently operable."
  - id: E15
    title: VAT Invoices
    status: pending
    runnable_flow: "Issue an approved VAT invoice linked to its originating workshop bill."
