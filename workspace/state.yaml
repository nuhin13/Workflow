    status: pending
    runnable_flow: "Create and progress or batch-enter a job, then find retained customer and vehicle history in a later online session."
  - id: E03
    title: Private Billing and Daily Cash
    status: pending
    runnable_flow: "Unlock protected money, bill and collect or retain a due, share a safe bill, reconcile the day, and relock."
  - id: E04
    title: Plans, Credits, and Service Reminders
    status: pending
    runnable_flow: "Exercise Free/Pro limits, SMS credits, one service reminder, one return, and protected ROI."
  - id: E05
    title: Admin Controls and Pilot Evidence
    status: pending
    runnable_flow: "Use an authorized audited admin control and view only approved pilot evidence."
  - id: E06
    title: Offline Work and Reconciliation
    status: pending
    runnable_flow: "Use approved Pro records offline, reconnect, and reconcile without loss, duplicate money effects, or tenant leaks."
  - id: E07
    title: Mechanics and Salary
    status: pending
    runnable_flow: "Manage approved mechanic and salary records while preserving owner-money privacy."
  - id: E08
    title: Inventory
    status: pending
    runnable_flow: "Record a stock movement and reconcile retained quantity without duplicate effects."
  - id: E09
    title: Appointments and Booking
    status: pending
    runnable_flow: "Submit a valid public booking and open its retained workshop details."
  - id: E10
    title: Reports
    status: pending
    runnable_flow: "Run an approved period report and reconcile its totals or truthful empty state."
  - id: E11
    title: Public Vehicle History
    status: pending
    runnable_flow: "Share a vehicle-history link containing only approved fields and no private workshop money."
  - id: E12
    title: Multi-branch Operation
    status: pending
    runnable_flow: "Select a branch and see only permitted branch records and approved aggregates."
  - id: E13
    title: Fleet Accounts
    status: pending
    runnable_flow: "Distinguish one fleet's vehicles, jobs, bills, and balances from retail and other fleets."
  - id: E14
    title: TireBook Exchange
    status: pending
    runnable_flow: "Exchange a consented booking and approved service history while Garazo remains independently operable."
  - id: E15
    title: VAT Invoices
    status: pending
    runnable_flow: "Issue an approved VAT invoice linked to its originating workshop bill."
