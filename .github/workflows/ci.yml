# E00-T03 · pull-request CI.
#
# This workflow VERIFIES. It does not deploy, and it holds no deployment
# credential: a pipeline that can reach production is a pipeline that can be
# made to reach production by anyone who can open a pull request. Deployment is
# the runbook in infra/vm/deploy-runbook.md, run deliberately by an operator.

name: CI

on:
  pull_request:
  push:
    branches: [main, development]

# Least privilege. Nothing here needs to write to the repository.
permissions:
  contents: read

concurrency:
  # A superseded run tells you about code nobody is merging any more.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.4.0"
  FLUTTER_VERSION: "3.44.0"

jobs:
  typescript:
    name: TypeScript — lint, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install
        # --frozen-lockfile: CI must fail on an out-of-date lockfile rather than
        # silently resolving different versions than a developer tested.
        run: pnpm install --frozen-lockfile

      - name: Verify pinned toolchain
        run: bash scripts/check-toolchain.sh

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format

      - name: Build
        run: pnpm --recursive --if-present run build

      - name: Test
        run: pnpm test

  contracts:
    name: Contracts and architecture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The OpenAPI generator runs on the JVM.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile

      - name: Design tokens have zero drift
        run: pnpm check:tokens

      - name: OpenAPI contract is valid and clients are clean
        run: pnpm check:api

  flutter:
    name: Flutter — analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Resolve dependencies
        working-directory: apps/mobile
        # Also generates AppLocalizations, which analyze and test both need.
        run: flutter pub get

      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze

      - name: Test
        working-directory: apps/mobile
        run: flutter test

  security:
    name: Secrets and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The scan greps tracked files; a shallow clone is enough, but the
          # full history is what makes a leaked-and-deleted credential visible.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: corepack enable pnpm

      - name: Secret scan
        run: bash scripts/scan-secrets.sh

      - run: pnpm install --frozen-lockfile

      - name: Dependency audit
        # Advisory: a new critical advisory against a transitive dependency
        # should not block an unrelated bug fix at 03:00. It is surfaced, and
        # acting on it is a decision, not an automatic merge block.
        continue-on-error: true
        run: pnpm audit --audit-level high

  runtime:
    name: Container images and Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Java for the OpenAPI generator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - run: corepack enable pnpm

      - name: Clean-clone gate
        # THE authoritative check: the same script a developer runs as
        # `make verify`, covering pinned toolchain, install, drift, lint,
        # format, build, every suite, secret scan, container images, Compose
        # health and the real UI-to-PostgreSQL round trip.
        #
        # It overlaps the jobs above ON PURPOSE. Those run in parallel and give
        # feedback in a couple of minutes; this one is slower and serial, and it
        # is the one that must be green to merge. If CI and local verification
        # diverge, one of them is lying — and it is usually the one nobody runs
        # by hand.
        run: bash scripts/verify-clean-clone.sh

      - name: Rehearse the VM rebuild
        # Provisions and mutates nothing. Fails if the VM stops being
        # rebuildable from source and declared off-host material.
        run: bash scripts/rehearse-vm-rebuild.sh dry-run
